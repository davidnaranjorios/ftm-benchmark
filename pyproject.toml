[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftm-benchmark"
version = "0.2.0"
description = "FTM Benchmark: does a language model abandon a correct decision under multi-turn social pressure when the data has not changed? (FARP)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "David Naranjo Ríos" }]
keywords = ["llm", "benchmark", "evaluation", "sycophancy", "multi-turn", "inspect-ai", "social-pressure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: none. The engine, the standalone runner and the mock adapter are
# stdlib-only. The Inspect task lives behind the [inspect] extra.
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3.150", "openai>=1.0"]
models = ["openai>=1.0", "anthropic>=0.25"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "inspect-ai>=0.3.150"]

[project.scripts]
ftm = "ftm.cli:main"

[project.entry-points.inspect_ai]
ftm_inspect = "ftm_inspect._registry"

[project.urls]
Repository = "https://github.com/davidnaranjorios/ftm-benchmark"

[tool.setuptools]
packages = ["ftm", "ftm_inspect"]
